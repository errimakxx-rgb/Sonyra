<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sonyra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#F5F2FF;--s1:#EAE4FF;--s2:#DAD2F8;--tx:#1B1737;--mu:#6A6490;--ac:#5B3FF0;--on:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13102A;--s1:#1D1940;--s2:#2B2659;--tx:#F3EFFF;--mu:#A39CCB;--ac:#B9A8FF;--on:#13102A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13102A;--s1:#1D1940;--s2:#2B2659;--tx:#F3EFFF;--mu:#A39CCB;--ac:#B9A8FF;--on:#13102A;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx)}
body{font:400 16px/1.4 "Bricolage Grotesque",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;transition:transform .15s}
button:active,.row:active{transform:scale(.96)}
button:focus-visible,input:focus-visible,.row:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:4px 20px 24px}
.top{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
.logo{display:flex;gap:8px;align-items:center;font-weight:800;font-size:26px;letter-spacing:-.04em}
h1{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:10px 0 16px;line-height:1.05}
h2.s{font-size:20px;font-weight:600;margin:26px 0 10px;letter-spacing:-.01em}
.cv{position:relative;overflow:hidden;display:block;aspect-ratio:1;border-radius:14px;background:radial-gradient(circle at 28% 22%,hsl(var(--h) 90% 78%),transparent 52%),conic-gradient(from calc(var(--h)*1deg) at 60% 60%,hsl(var(--h) 55% 32%),hsl(calc(var(--h) + 50) 70% 48%),hsl(var(--h) 55% 32%))}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.row{display:flex;align-items:center;gap:12px;padding:7px 0;cursor:pointer;transition:transform .15s}
.row .cv{width:52px;flex:none}
.row.on .tt{color:var(--ac)}
.meta{flex:1;min-width:0}
.tt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar{color:var(--mu);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{position:relative;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--mu);flex:none}
.ib.on{color:var(--ac)}
.qb{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:var(--s1);color:var(--mu);flex:none}.qb:hover{color:var(--ac)}
.queueHead{display:flex;align-items:center;justify-content:space-between;margin-top:20px}.queueHead .s{margin:0}.queueActions{display:flex;gap:8px}.queueItem{display:flex;align-items:center;gap:10px;padding:6px 0}.queueItem .cv{width:44px;flex:none}.queueItem .meta{min-width:0}.queueItem .qremove{width:36px;height:36px}.queueEmpty{color:var(--mu);font-size:14px;padding:8px 0 16px}
.like.on svg,#fl.on svg{fill:currentColor;animation:pop .35s}
.hs{display:flex;gap:14px;overflow-x:auto;margin:0 -20px;padding:0 20px 4px;scroll-snap-type:x proximity}
.card{flex:none;width:140px;text-align:left;scroll-snap-align:start}
.card .cv{margin-bottom:8px;border-radius:18px}.artist{display:flex;align-items:center;gap:14px;padding:14px 0;cursor:pointer}.artist .cv{width:64px;height:64px;border-radius:50%;flex:none}.artistName{font-weight:800;font-size:18px}.profileTop{display:flex;align-items:center;gap:14px;margin:8px 0 18px}.profileTop .cv{width:88px;height:88px;border-radius:50%;flex:none}.back{margin-bottom:8px}.albumTitle{font-weight:700;margin-top:6px}
.btns,.chips{display:flex;gap:10px;flex-wrap:wrap}
.chips{margin-bottom:8px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:99px;font-weight:600;background:var(--s1)}
.pill.p{background:var(--ac);color:var(--on)}
.add{margin-top:12px}
.empty{padding:20px 0;color:var(--mu)}
input.q{width:100%;box-sizing:border-box;padding:14px 18px;border-radius:99px;border:2px solid transparent;background:var(--s1);color:var(--tx);font:inherit;margin-bottom:14px;transition:border-color .2s}
input.q:focus-visible{outline:none;border-color:var(--ac)}
#mini{position:relative;display:flex;align-items:center;gap:12px;margin:0 10px 6px;padding:8px 4px 10px 8px;border-radius:16px;background:var(--s2);cursor:pointer;animation:up .4s cubic-bezier(.2,.8,.2,1)}
#mini[hidden]{display:none}
#mini .cv{width:44px;border-radius:10px;flex:none}
.bar{position:absolute;left:14px;right:14px;bottom:3px;height:2px}
.bar i{display:block;height:100%;width:var(--p,0%);background:var(--ac);border-radius:1px}
#tabs{display:flex;border-top:1px solid var(--s1)}
#tabs button{flex:1;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mu)}
#tabs button.on{color:var(--ac)}
#tabs button.on svg{transform:translateY(-2px) scale(1.1)}
#tabs svg{transition:transform .25s}
#full{position:fixed;inset:0;z-index:5;background:var(--bg);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 8px) 24px calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateY(100%);visibility:hidden;transition:transform .4s cubic-bezier(.2,.8,.2,1),visibility 0s .4s}
#full.open{transform:none;visibility:visible;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.ftop{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:14px}
.ftop i{width:44px}
.viz{position:relative;width:min(100%,360px,44vh);aspect-ratio:1;margin:8px auto 18px}
.disc{position:absolute;left:19%;top:19%;width:62%;border-radius:50%;box-shadow:0 12px 40px rgba(0,0,0,.35);animation:spin 20s linear infinite;animation-play-state:paused}
#full.pl .disc{animation-play-state:running}
.ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--ac);opacity:0}
#full.pl .ring{animation:pulse 2.6s ease-out infinite}
#full.pl .r2{animation-delay:1.3s}
.info{display:flex;align-items:center;gap:8px}
.info>div{flex:1;min-width:0}
#ft{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:0;line-height:1.1}
#fa{margin:2px 0 0;color:var(--mu)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:6px 0 0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--ac) var(--p,0%),var(--s2) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--ac);margin-top:-5px}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--s2)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--ac)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--ac)}
.tm{display:flex;justify-content:space-between;color:var(--mu);font-size:13px;font-variant-numeric:tabular-nums}
.ctl{display:flex;justify-content:space-between;align-items:center;margin:8px 0}
.big{width:72px;height:72px;border-radius:50%;background:var(--ac);color:var(--on);display:grid;place-items:center}
.big svg{width:32px;height:32px}
#rp[data-m="2"]::after{content:"1";position:absolute;top:8px;right:9px;font-size:10px;font-weight:800}
.eq{position:absolute;inset:0;display:none;align-items:flex-end;justify-content:center;gap:3px;padding:12px;background:rgba(0,0,0,.4)}
body.pl .row.on .eq{display:flex}
.eq b{width:4px;border-radius:2px;background:#fff;animation:eq .9s ease-in-out infinite}
.eq b:nth-child(2){animation-delay:.2s}.eq b:nth-child(3){animation-delay:.4s}
.sk{background:linear-gradient(100deg,var(--s1) 30%,var(--s2) 50%,var(--s1) 70%) 0 0/200% 100%;animation:sh 1.4s linear infinite;border-radius:14px}
.in{animation:up .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 130px);transform:translate(-50%,20px);opacity:0;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;transition:.3s;pointer-events:none;z-index:9;max-width:80%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes sh{to{background-position:-200% 0}}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{from{transform:scale(.64);opacity:.6}to{transform:scale(1);opacity:0}}
@keyframes pop{50%{transform:scale(1.4)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <main id="main"></main>
  <div id="mini" hidden></div>
  <nav id="tabs" aria-label="Sezioni"></nav>
</div>
<section id="full" aria-label="In riproduzione">
  <div class="ftop"><button class="ib" id="close" aria-label="Chiudi"></button><span>In riproduzione</span><i></i></div>
  <div class="viz"><i class="ring r1"></i><i class="ring r2"></i><div class="cv disc" id="fcv"></div></div>
  <div class="info"><div><h2 id="ft"></h2><p id="fa"></p></div><button class="ib" id="fl" aria-label="Preferito"></button></div>
  <input type="range" id="sk" min="0" max="1000" value="0" aria-label="Posizione">
  <div class="tm"><span id="t1">0:00</span><span id="t2">0:00</span></div>
  <div class="ctl">
    <button class="ib" id="sh" aria-label="Casuale"></button>
    <button class="ib" id="pv" aria-label="Precedente"></button>
    <button class="big" id="pp" aria-label="Riproduci"></button>
    <button class="ib" id="nx" aria-label="Successivo"></button>
    <button class="ib" id="rp" aria-label="Ripeti"></button>
  </div>
  <div id="ytplayer" style="position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;overflow:hidden"></div><div id="nl"></div>
</section>
<div id="toast" role="status"></div>
<audio id="au" preload="auto"></audio>
<input type="file" id="pick" accept="audio/*" multiple hidden>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
(()=>{
const $=s=>document.querySelector(s),au=$('#au'),main=$('#main'),known=new Map();
const I={
play:'<path d="M8 5v14l11-7z"/>',pause:'<path d="M7 5h3v14H7zM14 5h3v14h-3z"/>',
next:'<path d="M6 5v14l9-7zM18 5v14"/>',prev:'<path d="M18 5v14l-9-7zM6 5v14"/>',
heart:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.600-7 10-7 10z"/>',
shuffle:'<path d="M4 7h3c5 0 5 10 10 10h3M4 17h3c1.500 0 2.600-.800 3.500-2M14 9c.900-1.200 2-2 3-2h3M17 4l3 3-3 3M17 14l3 3-3 3"/>',
repeat:'<path d="M4 11V9a3 3 0 0 1 3-3h12M16 3l3 3-3 3M20 13v2a3 3 0 0 1-3 3H5M8 21l-3-3 3-3"/>',
down:'<path d="M6 9l6 6 6-6"/>',home:'<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',
search:'<circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/>',lib:'<path d="M5 4v16M10 4v16M15 6l5 13"/>',plus:'<path d="M12 5v14M5 12h14"/>',
refresh:'<path d="M20 12a8 8 0 1 1-2.500-5.800M20 4v5h-5"/>'};
const ic=(n,f)=>`<svg viewBox="0 0 24 24" width="24" height="24" fill="${f?'currentColor':'none'}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{if(!isFinite(s))return'0:00';s=Math.floor(s);return(s/60|0)+':'+String(s%60).padStart(2,'0')};
let toastT;const toast=m=>{const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),3000)};
document.addEventListener('error',e=>{if(e.target.tagName==='IMG')e.target.remove()},true);

/* Catalogo YouTube.
   Per la ricerca via YouTube Data API serve una API key propria.
   Il player usa la YouTube IFrame Player API ufficiale. */
const YOUTUBE_API_KEY='AIzaSyDBW55yvPvlkx_kyojOeZSKeWGY0Y9dM8k';
const YT_API='https://www.googleapis.com/youtube/v3';
const cache=new Map();let lastErr='';
let ytPlayer=null,ytReady=false,ytPending=null;

window.onYouTubeIframeAPIReady=()=>{ytReady=true;if(ytPending){createYTPlayer();}};
setTimeout(()=>{if(!ytReady)lastErr='YouTube Player API non caricata: controlla la connessione o eventuali blocchi del browser.'},8000);
function createYTPlayer(){
  if(!ytPending || !window.YT || !YT.Player)return;
  const {videoId}=ytPending;
  const host=document.getElementById('ytplayer');
  if(!host){ytPending=null;toast('Player YouTube non disponibile.');return}
  if(ytPlayer){try{ytPlayer.destroy()}catch(e){}ytPlayer=null}
  host.innerHTML='';
  ytPlayer=new YT.Player(host,{height:'1',width:'1',videoId,playerVars:{autoplay:1,playsinline:1,rel:0,controls:0},events:{
    onReady:()=>{try{ytPlayer.playVideo()}catch(e){}paintTrack();paintState()},
    onStateChange:e=>{if(e.data===0)next(true);paintState()},
    onError:e=>{toast('YouTube non può riprodurre questo video. Prova un altro risultato.');paintState()}
  }});
  ytPending=null;
}
function ensureYT(videoId){
  ytPending={videoId};
  if(ytReady)createYTPlayer();
}
function ytStop(){try{if(ytPlayer)ytPlayer.stopVideo()}catch(e){}}
async function getJSON(url){
  const r=await fetch(url,{headers:{Accept:'application/json'}});
  let d=null;try{d=await r.json()}catch(e){}
  if(!r.ok){const msg=d?.error?.message||('HTTP '+r.status);throw new Error(msg)}
  return d;
}
async function ytSearch(term,n){
  if(!YOUTUBE_API_KEY)throw new Error('Inserisci YOUTUBE_API_KEY nel file index.html');
  const u=YT_API+'/search?part=snippet&type=video&videoEmbeddable=true&videoSyndicated=true&maxResults='+Math.min(n,50)+'&q='+encodeURIComponent(term)+'&key='+encodeURIComponent(YOUTUBE_API_KEY);
  const d=await getJSON(u);
  return (d.items||[]).map(x=>({
    id:'yt'+x.id.videoId,youtubeId:x.id.videoId,t:x.snippet.title,
    a:x.snippet.channelTitle||'',img:x.snippet.thumbnails?.high?.url||x.snippet.thumbnails?.medium?.url||'',
    hue:(Number(String(x.id.videoId).replace(/\D/g,''))||1)%360,full:true,source:'youtube'
  }));
}
async function find(term,n){const key='yt|'+term+'|'+n;if(cache.has(key))return cache.get(key);lastErr='';const r=await ytSearch(term,n);r.forEach(t=>known.set(t.id,t));cache.set(key,r);return r}
async function findArtists(term,n){
  const key='artists|'+term+'|'+n;if(cache.has(key))return cache.get(key);
  const d=await getJSON('https://itunes.apple.com/search?media=music&entity=musicArtist&country=IT&limit='+n+'&term='+encodeURIComponent(term));
  const r=(d.results||[]).map(x=>({id:'a'+x.artistId,artistId:x.artistId,name:x.artistName,genre:x.primaryGenreName||'Artista',type:'artist'}));cache.set(key,r);return r;
}
async function artistProfile(artistId){
  const key='profile|'+artistId;if(cache.has(key))return cache.get(key);
  const d=await getJSON('https://itunes.apple.com/lookup?entity=album&country=IT&limit=50&id='+encodeURIComponent(artistId));
  const albums=(d.results||[]).filter(x=>x.wrapperType==='collection').map(x=>({id:String(x.collectionId),name:x.collectionName,artist:x.artistName,img:(x.artworkUrl100||'').replace('100x100','400x400'),year:x.releaseDate?x.releaseDate.slice(0,4):'',trackCount:x.trackCount||0}));
  const profile={id:String(artistId),name:d.results?.[0]?.artistName||'Artista',genre:d.results?.[0]?.primaryGenreName||'',albums};cache.set(key,profile);return profile;
}
async function albumTracks(albumId){
  const key='album|'+albumId;if(cache.has(key))return cache.get(key);
  const d=await getJSON('https://itunes.apple.com/lookup?entity=song&country=IT&limit=200&id='+encodeURIComponent(albumId));
  const raw=(d.results||[]).filter(x=>x.wrapperType==='track');
  const out=[];
  for(const x of raw){
    try{const r=await ytSearch(x.artistName+' '+x.trackName,1);if(r[0]){r[0].t=x.trackName;r[0].a=x.artistName;r[0].img=(x.artworkUrl100||'').replace('100x100','400x400');out.push(r[0]);}}
    catch(e){lastErr=e.message;break}
  }
  out.forEach(t=>known.set(t.id,t));cache.set(key,out);return out;
}

const POOL=[['Pop del momento','pop hits'],['Rock da ascoltare','rock classics'],['Musica italiana','musica italiana'],['Hip hop','hip hop'],['Indie','indie pop'],['Jazz di sera','jazz'],['Elettronica','electronic'],['Cantautori','cantautori italiani'],['Latin','latin pop'],['Pianoforte','piano classical'],['Soul e R&B','soul r&b'],['Anni ’90','90s hits'],['Reggae','reggae'],['Folk acustico','acoustic folk']];
const rnd=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

/* Stato */
let view='home',lib='fav',query='',ctx=[],q=[],idx=-1,sh=false,rp=0,shelves=null,results=null,tok=0,tm,fav=[],mine=[];
try{fav=JSON.parse(localStorage.getItem('sonyra-fav')||'[]');fav.forEach(t=>known.set(t.id,t))}catch(e){}
const saveFav=()=>{try{localStorage.setItem('sonyra-fav',JSON.stringify(fav.filter(t=>!t.user)))}catch(e){}};
const isFav=id=>fav.some(t=>t.id===id),cur=()=>q[idx]||null;
function addToQueue(t){if(!t)return;if(q.some(x=>x.id===t.id)){toast('Questo brano è già in coda.');return}q.push(t);if(idx<0)idx=0;paintTrack();toast('Aggiunto alla coda.')}
function removeFromQueue(i){if(i<0||i>=q.length)return;const wasCurrent=i===idx;q.splice(i,1);if(!q.length){idx=-1;au.pause();au.removeAttribute('src');au.load();paintTrack();return}if(i<idx)idx--;else if(wasCurrent){if(idx>=q.length)idx=q.length-1;load(idx)}paintNext()}
function skipTo(i){if(i>=0&&i<q.length)load(i)}

async function loadHome(force){const seed=force?Date.now():Math.floor(Date.now()/216e5),ck='sonyra-home';
if(!force){try{const c=JSON.parse(localStorage.getItem(ck));if(c&&c.seed===seed&&c.s.length){shelves=c.s;shelves.forEach(x=>x.items.forEach(t=>known.set(t.id,t)));if(view==='home')render();return}}catch(e){}}
shelves=null;if(view==='home')render();
const r=rnd(seed),pick=POOL.slice().sort(()=>r()-.5).slice(0,3),out=[];
for(const p of pick){try{out.push({title:p[0],items:await find(p[1],14)});shelves=out.slice();if(view==='home')render()}catch(e){}}
shelves=out;if(out.length)try{localStorage.setItem(ck,JSON.stringify({seed,s:out}))}catch(e){}
if(view==='home')render()}

/* Viste */
const cv=(t,eq)=>`<div class="cv" style="--h:${t.hue}">${t.img?`<img src="${esc(t.img)}" alt="" loading="lazy">`:''}${eq?'<span class="eq"><b></b><b></b><b></b></span>':''}</div>`;
const row=(t,i)=>`<div class="row in${cur()&&cur().id===t.id?' on':''}" style="--i:${Math.min(i,10)}" data-i="${i}" data-id="${t.id}" role="button" tabindex="0">${cv(t,1)}<div class="meta"><div class="tt">${esc(t.t)}</div><div class="ar">${esc(t.a)}${t.full?' · completo':' · anteprima'}</div></div><button class="ib qb" data-queue="${t.id}" aria-label="Aggiungi alla coda">${ic('plus')}</button><button class="ib like${isFav(t.id)?' on':''}" data-like="${t.id}" aria-label="Preferito">${ic('heart')}</button></div>`;
const hd=()=>`<div class="top"><div class="logo"><svg width="26" height="26" viewBox="0 0 26 26" fill="var(--ac)" aria-hidden="true"><rect x="2" y="9" width="4" height="8" rx="2"/><rect x="8" y="3" width="4" height="20" rx="2"/><rect x="14" y="7" width="4" height="12" rx="2"/><rect x="20" y="11" width="4" height="4" rx="2"/></svg>sonyra</div><button class="ib" data-act="add" aria-label="Aggiungi musica dal dispositivo">${ic('plus')}</button></div>`;
const noNet=()=>`<p class="empty">${YOUTUBE_API_KEY?'YouTube ha rifiutato la richiesta. Controlla la chiave API, il progetto Google Cloud e che YouTube Data API v3 sia abilitata.':'Per cercare su YouTube devi inserire la tua API key nel campo YOUTUBE_API_KEY del file index.html.'}</p><p class="ar">${esc(lastErr)}</p>`;
function artistRow(a,i){return `<div class="artist in" style="--i:${Math.min(i,10)}" data-artist="${a.artistId}" role="button" tabindex="0">
<div class="cv" style="--h:${(Number(a.artistId)||1)%360}"></div><div class="meta"><div class="artistName">${esc(a.name)}</div><div class="ar">${esc(a.genre)}</div></div></div>`}

function paintRes(){const el=$('#res');if(!el)return;
if(results==='load')el.innerHTML=[0,1,2,3,4,5].map(()=>'<div class="row"><div class="cv sk" style="width:52px;flex:none"></div><div class="meta"><div class="sk" style="height:14px;width:60%;margin-bottom:8px"></div><div class="sk" style="height:12px;width:35%"></div></div></div>').join('');
else if(results==='err')el.innerHTML=noNet();
else if(!results)el.innerHTML=`<div class="chips">${['Pop','Rock','Jazz','Hip hop','Italiane','Classica'].map(c=>`<button class="pill in" data-chip="${c}">${c}</button>`).join('')}</div><p class="empty">Cerca una canzone oppure un artista. I brani disponibili per intero sono indicati come “completo”. Toccando un artista puoi vedere il suo profilo e gli album.</p>`;
else if(!results.length)el.innerHTML=`<p class="empty">Nessun risultato per “${esc(query)}”. Prova con un altro titolo o con l’artista.</p>`;
else{
  const artists=results.artists||[],tracks=results.tracks||[];
  ctx=tracks;
  el.innerHTML=(artists.length?`<h2 class="s">Artisti</h2>${artists.map(artistRow).join('')}`:'')
    +(tracks.length?`<h2 class="s">Canzoni</h2>${tracks.map(row).join('')}`:'');
}}
function runSearch(){clearTimeout(tm);const s=query.trim();if(!s){tok++;results=null;return paintRes()}
tm=setTimeout(async()=>{const k=++tok;results='load';paintRes();
try{
  const [artists,tracks]=await Promise.all([findArtists(s,8).catch(()=>[]),find(s,25)]);
  if(k!==tok)return;
  results={artists,tracks};
}catch(e){if(k!==tok)return;lastErr=e?.message||String(e);results='err'}
paintRes()},350)}
async function openArtist(id){
  main.innerHTML=`${hd()}<button class="pill back" data-back-search>← Torna alla ricerca</button><div class="empty">Caricamento profilo…</div>`;
  try{
    const p=await artistProfile(id);
    main.innerHTML=`${hd()}<button class="pill back" data-back-search>← Torna alla ricerca</button>
      <div class="profileTop"><div class="cv" style="--h:${(Number(id)||1)%360}"></div>
      <div><h1 style="margin:0">${esc(p.name)}</h1><div class="ar">${esc(p.genre||'Artista')}</div></div></div>
      <h2 class="s">Album</h2>
      <div class="hs">${p.albums.map((a,j)=>`<button class="card in" style="--i:${Math.min(j,8)}" data-album="${a.id}">${a.img?`<div class="cv"><img src="${esc(a.img)}" alt="" loading="lazy"></div>`:`<div class="cv" style="--h:${j*47%360}"></div>`}<div class="albumTitle">${esc(a.name)}</div><div class="ar">${esc(a.year)}${a.trackCount?' · '+a.trackCount+' brani':''}</div></button>`).join('')}</div>
      ${p.albums.length?'':'<p class="empty">Nessun album trovato.</p>'}`;
  }catch(e){main.innerHTML=`${hd()}<button class="pill back" data-back-search>← Torna alla ricerca</button><p class="empty">Non riesco a caricare il profilo dell'artista.</p>`}
}
async function openAlbum(id){
  main.innerHTML=`${hd()}<button class="pill back" data-back-search>← Torna alla ricerca</button><p class="empty">Caricamento album…</p>`;
  try{
    const tracks=await albumTracks(id);
    ctx=tracks;
    main.innerHTML=`${hd()}<button class="pill back" data-back-search>← Torna alla ricerca</button><h1 class="in">Album</h1><div style="margin-top:12px">${tracks.length?tracks.map(row).join(''):'<p class="empty">Nessun brano disponibile.</p>'}</div>`;
  }catch(e){main.innerHTML=`${hd()}<button class="pill back" data-back-search>← Torna alla ricerca</button><p class="empty">Non riesco a caricare l'album.</p>`}
}
function render(){
document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
if(view==='home'){
const h=new Date().getHours(),g=h<6?'Buonanotte':h<13?'Buongiorno':h<19?'Buon pomeriggio':'Buonasera';
let body;
if(shelves===null)body=[0,1].map(()=>`<div class="sk" style="height:22px;width:50%;margin:26px 0 12px"></div><div class="hs">${[0,1,2,3].map(()=>'<div class="sk" style="width:140px;height:190px;flex:none"></div>').join('')}</div>`).join('');
else if(!shelves.length)body=noNet()+'<button class="pill" data-act="retry">Riprova</button>';
else body=shelves.map((s,k)=>`<h2 class="s in" style="--i:${k*3}">${esc(s.title)}</h2><div class="hs">${s.items.map((t,j)=>`<button class="card in" style="--i:${k*3+Math.min(j,6)+1}" data-s="${k}" data-i="${j}">${cv(t)}<div class="tt">${esc(t.t)}</div><div class="ar">${esc(t.a)}</div></button>`).join('')}</div>`).join('');
main.innerHTML=`${hd()}<h1 class="in">${g}</h1><div class="btns in" style="--i:2"><button class="pill p" data-act="all">Riproduci tutto</button><button class="pill" data-act="fresh">${ic('refresh')} Nuove idee</button></div>${body}`;
}else if(view==='search'){
main.innerHTML=`${hd()}<h1 class="in">Cerca</h1><input class="q" id="qi" type="search" placeholder="Cerca canzoni o artisti" value="${esc(query)}" autocomplete="off"><div id="res"></div>`;paintRes();
}else{
const r=lib==='fav'?fav:mine;ctx=r;
main.innerHTML=`${hd()}<h1 class="in">Libreria</h1><div class="btns"><button class="pill${lib==='fav'?' p':''}" data-lib="fav">Preferiti</button><button class="pill${lib==='mine'?' p':''}" data-lib="mine">I tuoi file</button></div>${lib==='mine'?`<button class="pill add" data-act="add">${ic('plus')} Aggiungi musica</button>`:''}<div style="margin-top:12px">${r.length?r.map(row).join(''):lib==='fav'?'<p class="empty">Tocca il cuore su un brano per salvarlo qui.</p>':'<p class="empty">Aggiungi file audio dal tuo dispositivo (mp3, m4a, wav, flac). Restano sul dispositivo e vanno ricaricati a ogni apertura. Con il nome “Artista - Titolo” Sonyra riconosce entrambi.</p>'}</div><p class="empty">Sonyra non aggiunge pubblicità proprie. I brani del catalogo vengono riprodotti tramite il player ufficiale YouTube; eventuali annunci o limitazioni di YouTube sono gestiti da YouTube.</p>`;
}}
$('#tabs').innerHTML=[['home','home','Home'],['search','search','Cerca'],['lib','lib','Libreria']].map(a=>`<button data-v="${a[0]}">${ic(a[1])}${a[2]}</button>`).join('');
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b)return;view=b.dataset.v;render();main.scrollTop=0});

/* Riproduzione */
function load(i){
 idx=i;const t=cur();if(!t)return;
 if(t.source==='youtube'){
   au.pause();au.removeAttribute('src');au.load();
   const box=$('#ytplayer');
   if(box){box.innerHTML='';if(ytPlayer){try{ytPlayer.destroy()}catch(e){}ytPlayer=null}ensureYT(t.youtubeId)}
 }else{au.src=t.url;au.play().catch(()=>{})}
 paintTrack();
 if('mediaSession' in navigator)try{navigator.mediaSession.metadata=new MediaMetadata({title:t.t,artist:t.a,album:'Sonyra'})}catch(e){}
}
function play(list,i){q=list.filter(Boolean).slice();idx=Math.max(0,Math.min(i,q.length-1));load(idx)}
function next(auto){if(!q.length)return;if(auto&&rp===2){au.currentTime=0;au.play();return}
let n;if(sh&&q.length>1){do n=Math.random()*q.length|0;while(n===idx)}else n=idx+1;
if(n>=q.length){if(auto&&rp===0){au.pause();return}n=0}load(n)}
function prev(){if(au.currentTime>3||!q.length){au.currentTime=0;return}load(idx>0?idx-1:q.length-1)}
const toggle=()=>{if(!cur())return;if(cur().source==='youtube'){try{if(ytPlayer.getPlayerState()===1)ytPlayer.pauseVideo();else ytPlayer.playVideo()}catch(e){}}else au.paused?au.play().catch(()=>{}):au.pause()};
try{const ms=navigator.mediaSession;ms.setActionHandler('play',()=>au.play());ms.setActionHandler('pause',()=>au.pause());ms.setActionHandler('previoustrack',prev);ms.setActionHandler('nexttrack',()=>next())}catch(e){}
function paintNext(){const nl=$('#nl');if(!nl)return;if(!q.length){nl.innerHTML='';return}const upcoming=q.slice(idx+1,idx+8);nl.innerHTML=`<div class="queueHead"><h2 class="s">Coda</h2><div class="queueActions"><button class="pill" data-clear-queue>Svota</button></div></div>`+(upcoming.length?upcoming.map((x,j)=>`<div class="queueItem" data-q="${idx+1+j}">${cv(x)}<div class="meta"><div class="tt">${esc(x.t)}</div><div class="ar">${esc(x.a)}</div></div><button class="ib qremove" data-remove-q="${idx+1+j}" aria-label="Rimuovi dalla coda">×</button></div>`).join(''):'<div class="queueEmpty">Nessun altro brano in coda.</div>')}
function paintTrack(){const t=cur();$('#mini').hidden=!t;if(!t)return;
$('#mini').innerHTML=`${cv(t)}<div class="meta"><div class="tt">${esc(t.t)}</div><div class="ar">${esc(t.a)}</div></div><button class="ib" id="mpp"></button><div class="bar"><i></i></div>`;
const f=$('#fcv');f.style.setProperty('--h',t.hue);f.innerHTML=t.img?`<img src="${esc(t.img)}" alt="">`:'';
$('#ft').textContent=t.t;$('#fa').textContent=t.a+(t.full?' · riproduzione completa':' · anteprima');$('#fl').className='ib'+(isFav(t.id)?' on':'');
document.querySelectorAll('main .row').forEach(r=>r.classList.toggle('on',r.dataset.id===t.id));
paintNext();paintState();paintTime()}
function paintState(){const pl=cur()?.source==='youtube'?(ytPlayer&&ytPlayer.getPlayerState&&ytPlayer.getPlayerState()===1):!au.paused,l=pl?'Pausa':'Riproduci';
document.body.classList.toggle('pl',pl);$('#full').classList.toggle('pl',pl);
$('#pp').innerHTML=ic(pl?'pause':'play',1);$('#pp').setAttribute('aria-label',l);
const m=$('#mpp');if(m){m.innerHTML=ic(pl?'pause':'play',1);m.setAttribute('aria-label',l)}
$('#sh').className='ib'+(sh?' on':'');$('#rp').className='ib'+(rp?' on':'');$('#rp').dataset.m=rp}
function paintTime(){const d=cur()?.source==='youtube'?(ytPlayer&&ytPlayer.getDuration?ytPlayer.getDuration():0):au.duration,c=cur()?.source==='youtube'?(ytPlayer&&ytPlayer.getCurrentTime?ytPlayer.getCurrentTime():0):au.currentTime,p=d?c/d*100:0,s=$('#sk');
s.value=d?c/d*1000:0;s.style.setProperty('--p',p+'%');$('#t1').textContent=fmt(c);$('#t2').textContent=fmt(d);
const bi=$('#mini .bar i');if(bi)bi.style.setProperty('--p',p+'%')}
['play','pause'].forEach(e=>au.addEventListener(e,paintState));
au.addEventListener('ended',()=>next(true));au.addEventListener('timeupdate',paintTime);au.addEventListener('loadedmetadata',paintTime);
au.addEventListener('error',()=>toast('Questo brano non è disponibile per la riproduzione. Prova con un altro risultato.'));

/* Eventi */
function toggleLike(id){const i=fav.findIndex(t=>t.id===id),t=known.get(id);if(i<0){if(t)fav.unshift(t)}else fav.splice(i,1);saveFav();
document.querySelectorAll('[data-like="'+id+'"]').forEach(b=>b.classList.toggle('on',isFav(id)));
const c=cur();if(c)$('#fl').className='ib'+(isFav(c.id)?' on':'');
if(view==='lib'&&lib==='fav')render()}
function act(a){if(a==='add')return $('#pick').click();
if(a==='fresh')return loadHome(true);if(a==='retry')return loadHome();
if(a==='all'&&shelves&&shelves.length){const all=shelves.flatMap(s=>s.items);if(all.length){sh=false;play(all,0)}}}
main.addEventListener('click',e=>{
const qadd=e.target.closest('[data-queue]');if(qadd){e.stopPropagation();addToQueue(known.get(qadd.dataset.queue));return}
const qremove=e.target.closest('[data-remove-q]');if(qremove){e.stopPropagation();removeFromQueue(+qremove.dataset.removeQ);return}
const qjump=e.target.closest('[data-q]');if(qjump){e.stopPropagation();skipTo(+qjump.dataset.q);return}
const clearQ=e.target.closest('[data-clear-queue]');if(clearQ){q=[];idx=-1;au.pause();au.removeAttribute('src');au.load();paintTrack();toast('Coda svuotata.');return}

const artist=e.target.closest('[data-artist]');if(artist)return openArtist(artist.dataset.artist);
const album=e.target.closest('[data-album]');if(album)return openAlbum(album.dataset.album);
const back=e.target.closest('[data-back-search]');if(back){view='search';render();return}
const L=e.target.closest('[data-like]');if(L)return toggleLike(L.dataset.like);
const A=e.target.closest('[data-act]');if(A)return act(A.dataset.act);
const B=e.target.closest('[data-lib]');if(B){lib=B.dataset.lib;return render()}
const C=e.target.closest('[data-chip]');if(C){query=C.dataset.chip;$('#qi').value=query;return runSearch()}
const R=e.target.closest('[data-i]');if(R)play(R.dataset.s!==undefined?shelves[+R.dataset.s].items:ctx,+R.dataset.i)});
main.addEventListener('input',e=>{if(e.target.id==='qi'){query=e.target.value;runSearch()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.row'))e.target.click();if(e.key==='Escape')closeFull()});
const openFull=()=>{$('#full').classList.add('open');$('#full').setAttribute('aria-hidden','false')};
const closeFull=()=>{$('#full').classList.remove('open');$('#full').setAttribute('aria-hidden','true')};
$('#mini').addEventListener('click',e=>{if(e.target.closest('#mpp'))toggle();else openFull()});
$('#close').addEventListener('click',closeFull);
$('#pp').addEventListener('click',toggle);$('#nx').addEventListener('click',()=>next());$('#pv').addEventListener('click',prev);
$('#sh').addEventListener('click',()=>{sh=!sh;paintState();paintNext()});
$('#rp').addEventListener('click',()=>{rp=(rp+1)%3;paintState()});
$('#fl').addEventListener('click',()=>{const t=cur();if(t)toggleLike(t.id)});
$('#sk').addEventListener('input',e=>{if(au.duration)au.currentTime=e.target.value/1000*au.duration});
$('#pick').addEventListener('change',e=>{const fs=[...e.target.files];let n=0;
fs.forEach(f=>{const name=f.name.replace(/\.[^.]+$/,'').replace(/_+/g,' ');let h=0;for(const c of name)h=(h*31+c.charCodeAt(0))%360;
const p=name.split(' - '),t={id:'u'+Date.now()+'-'+(n++),t:p.length>1?p.slice(1).join(' - '):name,a:p.length>1?p[0]:'Dal tuo dispositivo',url:URL.createObjectURL(f),hue:h,user:1};known.set(t.id,t);mine.push(t)});
e.target.value='';if(fs.length){view='lib';lib='mine';render()}});

/* Avvio */
$('#close').innerHTML=ic('down');$('#fl').innerHTML=ic('heart');$('#sh').innerHTML=ic('shuffle');$('#pv').innerHTML=ic('prev',1);$('#nx').innerHTML=ic('next',1);$('#rp').innerHTML=ic('repeat');
paintState();render();loadHome();
})();
</script>
</body>
</html>
