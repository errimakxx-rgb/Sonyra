<style>
:root{--bg:#F5F2FF;--s1:#EAE4FF;--s2:#DAD2F8;--tx:#1B1737;--mu:#6A6490;--ac:#5B3FF0;--on:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13102A;--s1:#1D1940;--s2:#2B2659;--tx:#F3EFFF;--mu:#A39CCB;--ac:#B9A8FF;--on:#13102A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13102A;--s1:#1D1940;--s2:#2B2659;--tx:#F3EFFF;--mu:#A39CCB;--ac:#B9A8FF;--on:#13102A;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx)}
body{font:400 16px/1.4 "Bricolage Grotesque",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;transition:transform .15s}
button:active,.row:active{transform:scale(.96)}
button:focus-visible,input:focus-visible,.row:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:4px 20px 24px}
.top{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
.logo{display:flex;gap:8px;align-items:center;font-weight:800;font-size:26px;letter-spacing:-.04em}
h1{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:10px 0 16px;line-height:1.05}
h2.s{font-size:20px;font-weight:600;margin:26px 0 10px;letter-spacing:-.01em}
.cv{position:relative;overflow:hidden;display:block;aspect-ratio:1;border-radius:14px;background:radial-gradient(circle at 28% 22%,hsl(var(--h) 90% 78%),transparent 52%),conic-gradient(from calc(var(--h)*1deg) at 60% 60%,hsl(var(--h) 55% 32%),hsl(calc(var(--h) + 50) 70% 48%),hsl(var(--h) 55% 32%))}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av{border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:26px;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.row{display:flex;align-items:center;gap:12px;padding:7px 0;cursor:pointer}
.row .cv{width:52px;flex:none}
.row.on .tt{color:var(--ac)}
.meta{flex:1;min-width:0}
.tt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar{color:var(--mu);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{position:relative;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--mu);flex:none}
.ib.on{color:var(--ac)}
.like.on svg,#fl.on svg{fill:currentColor;animation:pop .35s}
.hs{display:flex;gap:14px;overflow-x:auto;margin:0 -20px;padding:0 20px 4px;scroll-snap-type:x proximity}
.card{flex:none;width:140px;text-align:left;scroll-snap-align:start}
.card .cv{margin-bottom:8px;border-radius:18px}
.card .av{border-radius:50%}
.art{flex:none;width:84px;text-align:center}.art .cv{width:72px;margin:0 auto 6px}
.btns,.chips{display:flex;gap:10px;flex-wrap:wrap}
.chips{margin-bottom:8px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:99px;font-weight:600;background:var(--s1)}
.pill.p{background:var(--ac);color:var(--on)}
.add{margin-top:12px}
.empty{padding:20px 0;color:var(--mu)}
.hero{display:flex;align-items:center;gap:16px;margin:4px 0 16px}.hero h1{margin:0}.hero .cv{width:104px;flex:none}.hero .av{font-size:42px}
.bio{color:var(--mu);font-size:15px;margin:14px 0 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}.bio.x{display:block}
input.q{width:100%;box-sizing:border-box;padding:14px 18px;border-radius:99px;border:2px solid transparent;background:var(--s1);color:var(--tx);font:inherit;margin-bottom:14px;transition:border-color .2s}
input.q:focus-visible{outline:none;border-color:var(--ac)}
#mini{position:relative;display:flex;align-items:center;gap:12px;margin:0 10px 6px;padding:8px 4px 10px 8px;border-radius:16px;background:var(--s2);cursor:pointer;animation:up .4s cubic-bezier(.2,.8,.2,1)}
#mini[hidden]{display:none}
#mini .cv{width:44px;border-radius:10px;flex:none}
.bar{position:absolute;left:14px;right:14px;bottom:3px;height:2px}
.bar i{display:block;height:100%;width:var(--p,0%);background:var(--ac);border-radius:1px}
#tabs{display:flex;border-top:1px solid var(--s1)}
#tabs button{flex:1;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mu)}
#tabs button.on{color:var(--ac)}
#tabs button.on svg{transform:translateY(-2px) scale(1.1)}
#tabs svg{transition:transform .25s}
#full{position:fixed;inset:0;z-index:5;background:var(--bg);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 8px) 24px calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateY(100%);visibility:hidden;transition:transform .4s cubic-bezier(.2,.8,.2,1),visibility 0s .4s}
#full.open{transform:none;visibility:visible;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.ftop{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:14px}
.viz{position:relative;width:min(100%,360px,44vh);aspect-ratio:1;margin:8px auto 18px}
.disc{position:absolute;left:19%;top:19%;width:62%;border-radius:50%;box-shadow:0 12px 40px rgba(0,0,0,.35);animation:spin 20s linear infinite;animation-play-state:paused}
#full.pl .disc{animation-play-state:running}
.ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--ac);opacity:0}
#full.pl .ring{animation:pulse 2.6s ease-out infinite}
#full.pl .r2{animation-delay:1.3s}
.info{display:flex;align-items:center;gap:8px}
.info>div{flex:1;min-width:0}
#ft{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:0;line-height:1.1}
#fa{margin:2px 0 0;color:var(--mu);cursor:pointer}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:6px 0 0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--ac) var(--p,0%),var(--s2) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--ac);margin-top:-5px}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--s2)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--ac)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--ac)}
.tm{display:flex;justify-content:space-between;color:var(--mu);font-size:13px;font-variant-numeric:tabular-nums}
.ctl{display:flex;justify-content:space-between;align-items:center;margin:8px 0}
.big{width:72px;height:72px;border-radius:50%;background:var(--ac);color:var(--on);display:grid;place-items:center}
.big svg{width:32px;height:32px}
#rp[data-m="2"]::after{content:"1";position:absolute;top:8px;right:9px;font-size:10px;font-weight:800}
.eq{position:absolute;inset:0;display:none;align-items:flex-end;justify-content:center;gap:3px;padding:12px;background:rgba(0,0,0,.4)}
body.pl .row.on .eq{display:flex}
.eq b{width:4px;border-radius:2px;background:#fff;animation:eq .9s ease-in-out infinite}
.eq b:nth-child(2){animation-delay:.2s}.eq b:nth-child(3){animation-delay:.4s}
.sk{background:linear-gradient(100deg,var(--s1) 30%,var(--s2) 50%,var(--s1) 70%) 0 0/200% 100%;animation:sh 1.4s linear infinite;border-radius:14px}
.in{animation:up .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
#sheet{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;background:rgba(0,0,0,0);visibility:hidden;transition:background .3s,visibility 0s .3s}
#sheet.open{background:rgba(0,0,0,.45);visibility:visible;transition:background .3s}
.sb{flex:1}.sc{background:var(--bg);border-radius:22px 22px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:70vh;overflow-y:auto}
#sheet.open .sc{transform:none}
.sc h3{margin:0 0 8px;font-size:15px;color:var(--mu);font-weight:600}
.si{display:block;width:100%;text-align:left;padding:14px 8px;font-size:17px;border-radius:10px}.si:active{background:var(--s1)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 130px);transform:translate(-50%,20px);opacity:0;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;transition:.3s;pointer-events:none;z-index:9;max-width:80%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes sh{to{background-position:-200% 0}}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{from{transform:scale(.64);opacity:.6}to{transform:scale(1);opacity:0}}
@keyframes pop{50%{transform:scale(1.4)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <main id="main"></main>
  <div id="mini" hidden></div>
  <nav id="tabs" aria-label="Sezioni"></nav>
</div>
<section id="full" aria-label="In riproduzione">
  <div class="ftop"><button class="ib" id="close" aria-label="Chiudi"></button><span>In riproduzione</span><button class="ib" id="fm" aria-label="Altro"></button></div>
  <div class="viz"><i class="ring r1"></i><i class="ring r2"></i><div class="cv disc" id="fcv"></div></div>
  <div class="info"><div><h2 id="ft"></h2><p id="fa"></p></div><button class="ib" id="fl" aria-label="Preferito"></button></div>
  <input type="range" id="sk" min="0" max="1000" value="0" aria-label="Posizione">
  <div class="tm"><span id="t1">0:00</span><span id="t2">0:00</span></div>
  <div class="ctl">
    <button class="ib" id="sh" aria-label="Casuale"></button>
    <button class="ib" id="pv" aria-label="Precedente"></button>
    <button class="big" id="pp" aria-label="Riproduci"></button>
    <button class="ib" id="nx" aria-label="Successivo"></button>
    <button class="ib" id="rp" aria-label="Ripeti"></button>
  </div>
  <button class="pill" id="sl">Timer di spegnimento</button>
  <div id="nl"></div>
</section>
<div id="sheet"></div>
<div id="toast" role="status"></div>
<audio id="au" preload="auto"></audio>
<script>
(()=>{
const $=s=>document.querySelector(s),au=$('#au'),main=$('#main'),known=new Map();
const API='https://api.audius.co/v1',APP='app_name=Sonyra';
const I={
play:'<path d="M8 5v14l11-7z"/>',pause:'<path d="M7 5h3v14H7zM14 5h3v14h-3z"/>',
next:'<path d="M6 5v14l9-7zM18 5v14"/>',prev:'<path d="M18 5v14l-9-7zM6 5v14"/>',
heart:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.600-7 10-7 10z"/>',
shuffle:'<path d="M4 7h3c5 0 5 10 10 10h3M4 17h3c1.500 0 2.600-.800 3.500-2M14 9c.900-1.200 2-2 3-2h3M17 4l3 3-3 3M17 14l3 3-3 3"/>',
repeat:'<path d="M4 11V9a3 3 0 0 1 3-3h12M16 3l3 3-3 3M20 13v2a3 3 0 0 1-3 3H5M8 21l-3-3 3-3"/>',
down:'<path d="M6 9l6 6 6-6"/>',left:'<path d="M15 6l-6 6 6 6"/>',more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
home:'<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',
search:'<circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/>',lib:'<path d="M5 4v16M10 4v16M15 6l5 13"/>',plus:'<path d="M12 5v14M5 12h14"/>',
refresh:'<path d="M20 12a8 8 0 1 1-2.500-5.800M20 4v5h-5"/>'};
const ic=(n,f)=>`<svg viewBox="0 0 24 24" width="24" height="24" fill="${f?'currentColor':'none'}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{if(!isFinite(s))return'0:00';s=Math.floor(s);return(s/60|0)+':'+String(s%60).padStart(2,'0')};
const hash=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
const rnd=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
let toastT;const toast=m=>{const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),2800)};
document.addEventListener('error',e=>{if(e.target.tagName==='IMG')e.target.remove()},true);

/* Catalogo Audius: brani interi, artisti, album */
const mc=new Map();let lastErr='';
async function api(p){const c=mc.get(p);if(c&&Date.now()-c.t<3e5)return c.d;
try{const r=await fetch(API+p+(p.includes('?')?'&':'?')+APP);if(!r.ok)throw new Error('HTTP '+r.status);const d=(await r.json()).data;mc.set(p,{t:Date.now(),d});return d}catch(e){lastErr=String(e.message||e);throw e}}
const im=o=>o?(o['480x480']||o['150x150']||o['1000x1000']||''):'';
const nt=x=>{if(!x||!x.id||x.is_streamable===false)return null;const u=x.user||{},t={id:x.id,t:x.title,a:u.name||'Artista',aid:u.id,img:im(x.artwork),hue:hash(x.id)};known.set(t.id,t);return t};
const nts=a=>(a||[]).map(nt).filter(Boolean);
const na=u=>({id:u.id,n:u.name,img:im(u.profile_picture),f:u.follower_count||0,hue:hash(u.id)});
const alb=p=>({id:p.id,n:p.playlist_name,img:im(p.artwork),by:(p.user||{}).name||'',album:!!p.is_album,hue:hash(p.id)});
const one=d=>Array.isArray(d)?d[0]:d;

/* Dati salvati sul dispositivo */
let S={fav:[],pl:[],alb:[],art:[],hist:[]};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('sonyra-s')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('sonyra-s',JSON.stringify(S))}catch(e){}};
S.fav.concat(S.hist).forEach(t=>known.set(t.id,t));S.pl.forEach(p=>p.tracks.forEach(t=>known.set(t.id,t)));
const isFav=id=>S.fav.some(t=>t.id===id),isArt=id=>S.art.some(a=>a.id===id),isAlb=id=>S.alb.some(a=>a.id===id);

let view='home',lib='songs',query='',ctx=[],q=[],idx=-1,sh=false,rp=0,home=null,shNow=[],results=null,tok=0,tm,stack=[];
const cur=()=>q[idx]||null,topD=()=>stack[stack.length-1];
const GEN=['Electronic','Hip-Hop/Rap','Rock','Pop','Alternative','Ambient','Lo-Fi','Jazz','R&B/Soul','Latin','Acoustic','Folk','Reggae','Classical','Funk','Blues'];
async function loadHome(force){home=null;if(view==='home'&&!stack.length)render();
const r=rnd(force?Date.now():Math.floor(Date.now()/216e5)),g=GEN.slice().sort(()=>r()-.5).slice(0,3),out=[];
const jobs=[['In tendenza','/tracks/trending?limit=18&time=week']].concat(g.map(x=>[x,'/tracks/trending?limit=18&time=month&genre='+encodeURIComponent(x)]));
for(const j of jobs){try{const items=nts(await api(j[1]));if(items.length){out.push({title:j[0],items});home=out.slice();if(view==='home'&&!stack.length)render()}}catch(e){}}
home=out;if(view==='home'&&!stack.length)render()}

/* Elementi grafici */
const cv=(t,eq)=>`<div class="cv" style="--h:${t.hue||0}">${t.img?`<img src="${esc(t.img)}" alt="" loading="lazy">`:''}${eq?'<span class="eq"><b></b><b></b><b></b></span>':''}</div>`;
const av=a=>`<div class="cv av" style="--h:${a.hue}">${esc((a.n||'?')[0])}${a.img?`<img src="${esc(a.img)}" alt="" loading="lazy">`:''}</div>`;
const row=(t,i)=>`<div class="row in${cur()&&cur().id===t.id?' on':''}" style="--i:${Math.min(i,10)}" data-i="${i}" data-id="${t.id}" role="button" tabindex="0">${cv(t,1)}<div class="meta"><div class="tt">${esc(t.t)}</div><div class="ar">${esc(t.a)}</div></div><button class="ib like${isFav(t.id)?' on':''}" data-like="${t.id}" aria-label="Preferito">${ic('heart')}</button><button class="ib" data-more="${t.id}" aria-label="Altro">${ic('more')}</button></div>`;
const lrow=(at,c,t,s)=>`<div class="row in" ${at} role="button" tabindex="0">${c}<div class="meta"><div class="tt">${esc(t)}</div><div class="ar">${esc(s)}</div></div></div>`;
const hd=()=>`<div class="top"><div class="logo"><svg width="26" height="26" viewBox="0 0 26 26" fill="var(--ac)" aria-hidden="true"><rect x="2" y="9" width="4" height="8" rx="2"/><rect x="8" y="3" width="4" height="20" rx="2"/><rect x="14" y="7" width="4" height="12" rx="2"/><rect x="20" y="11" width="4" height="4" rx="2"/></svg>sonyra</div></div>`;
const emp=t=>`<p class="empty">${t}</p>`;
const noNet=()=>`<p class="empty">Non riesco a collegarmi al catalogo musicale. Controlla la connessione e riprova.</p><p class="ar">${esc(lastErr)}</p>`;
const skel=n=>Array.from({length:n},()=>'<div class="row"><div class="cv sk" style="width:52px;flex:none"></div><div class="meta"><div class="sk" style="height:14px;width:60%;margin-bottom:8px"></div><div class="sk" style="height:12px;width:35%"></div></div></div>').join('');
const cards=(arr,at,mk)=>`<div class="hs">${arr.map((x,i)=>`<button class="${at.c||'card'} in" style="--i:${Math.min(i,6)}" ${mk(x,i)}>${at.v(x)}<div class="tt">${esc(at.t(x))}</div><div class="ar">${esc(at.s(x))}</div></button>`).join('')}</div>`;
const albCards=a=>cards(a,{v:cv,t:x=>x.n,s:x=>x.by||(x.album?'Album':'Playlist')},x=>`data-alb="${x.id}"`);

function paintRes(){const el=$('#res');if(!el)return;
if(results==='load')el.innerHTML=skel(6);
else if(results==='err')el.innerHTML=noNet();
else if(!results)el.innerHTML=`<div class="chips">${['Elettronica','Hip hop','Rock','Lo-fi','Jazz','Ambient'].map(c=>`<button class="pill in" data-chip="${c}">${c}</button>`).join('')}</div>`+emp('Scrivi il titolo di un brano, un artista o un album.');
else{ctx=results.t;const r=results;
el.innerHTML=!r.t.length&&!r.u.length&&!r.p.length?emp(`Nessun risultato per “${esc(query)}”. Prova con un altro titolo o con l’artista.`):
(r.u.length?`<h2 class="s">Artisti</h2>${cards(r.u,{c:'art',v:av,t:x=>x.n,s:x=>x.f.toLocaleString('it-IT')+' follower'},x=>`data-art="${x.id}"`)}`:'')+
(r.p.length?`<h2 class="s">Album e playlist</h2>${albCards(r.p)}`:'')+
(r.t.length?'<h2 class="s">Brani</h2>'+r.t.map(row).join(''):'')}}
function runSearch(){clearTimeout(tm);const s=query.trim();if(!s){tok++;results=null;return paintRes()}
tm=setTimeout(async()=>{const k=++tok,e=encodeURIComponent(s);results='load';paintRes();
try{const[t,u,p]=await Promise.all([api('/tracks/search?limit=25&query='+e),api('/users/search?limit=8&query='+e).catch(()=>[]),api('/playlists/search?limit=10&query='+e).catch(()=>[])]);
if(k!==tok)return;results={t:nts(t),u:(u||[]).map(na),p:(p||[]).map(alb)}}catch(x){if(k!==tok)return;results='err'}paintRes()},350)}

function render(){
document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
if(stack.length)return renderD(topD());
if(view==='home'){
const h=new Date().getHours(),g=h<6?'Buonanotte':h<13?'Buongiorno':h<19?'Buon pomeriggio':'Buonasera';
shNow=(S.hist.length?[{title:'Ascoltati di recente',items:S.hist.slice(0,15)}]:[]).concat(home||[]);
const body=shNow.map((s,k)=>`<h2 class="s in" style="--i:${k*3}">${esc(s.title)}</h2>${cards(s.items,{v:cv,t:x=>x.t,s:x=>x.a},(x,j)=>`data-s="${k}" data-i="${j}"`)}`).join('')+(home===null?'<div class="sk" style="height:22px;width:50%;margin:26px 0 12px"></div>'+skel(3):'')+(home&&!home.length?noNet()+'<button class="pill" data-act="retry">Riprova</button>':'');
main.innerHTML=`${hd()}<h1 class="in">${g}</h1><div class="btns in" style="--i:2"><button class="pill p" data-act="all">Riproduci tutto</button><button class="pill" data-act="fresh">${ic('refresh')} Nuove idee</button></div>${body}`;
}else if(view==='search'){
main.innerHTML=`${hd()}<h1 class="in">Cerca</h1><input class="q" id="qi" type="search" placeholder="Brani, artisti, album" value="${esc(query)}" autocomplete="off"><div id="res"></div>`;paintRes();
}else{
let b;
if(lib==='songs'){ctx=S.fav;b=S.fav.map(row).join('')||emp('Tocca il cuore su un brano per salvarlo qui.')}
else if(lib==='pl')b=`<button class="pill p add" data-act="newpl">${ic('plus')} Nuova playlist</button><div style="margin-top:8px">${S.pl.map(p=>lrow(`data-pl="${p.id}"`,cv(p.tracks[0]||{hue:hash(p.id)}),p.name,p.tracks.length+' brani')).join('')||emp('Crea la tua prima playlist, poi aggiungi brani dal menu ⋯ di ogni canzone.')}</div>`;
else if(lib==='alb')b=S.alb.map(a=>lrow(`data-alb="${a.id}"`,cv(a),a.n,a.by)).join('')||emp('Salva un album o una playlist dalla sua pagina.');
else b=S.art.map(a=>lrow(`data-art="${a.id}"`,av(a),a.n,'Artista')).join('')||emp('Segui un artista dalla sua pagina.');
main.innerHTML=`${hd()}<h1 class="in">Libreria</h1><div class="chips">${[['songs','Brani'],['pl','Playlist'],['alb','Album'],['art','Artisti']].map(c=>`<button class="pill${lib===c[0]?' p':''}" data-lib="${c[0]}">${c[1]}</button>`).join('')}</div><div>${b}</div><p class="empty">Sonyra non mostra pubblicità. La musica arriva da Audius, con brani interi di artisti indipendenti.</p>`;
}}
$('#tabs').innerHTML=[['home','home','Home'],['search','search','Cerca'],['lib','lib','Libreria']].map(a=>`<button data-v="${a[0]}">${ic(a[1])}${a[2]}</button>`).join('');
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b)return;view=b.dataset.v;stack=[];render();main.scrollTop=0});

/* Artisti, album, playlist */
async function openD(k,id){const o={k,id,ok:k==='mypl'?1:0};stack.push(o);render();main.scrollTop=0;if(o.ok)return;
try{if(k==='artist'){const[u,tr,al]=await Promise.all([api('/users/'+id),api('/users/'+id+'/tracks?limit=20&sort=plays'),api('/users/'+id+'/albums?limit=30').catch(()=>[])]);
const x=one(u);o.u=na(x);o.bio=x.bio||'';o.songs=nts(tr);o.albums=(al||[]).map(alb)}
else{const[p,tr]=await Promise.all([api('/playlists/'+id),api('/playlists/'+id+'/tracks')]);o.a=alb(one(p));o.songs=nts(tr)}}catch(e){o.err=1}
o.ok=1;if(topD()===o)render()}
function renderD(o){const back=`<div class="top"><button class="ib" data-act="back" aria-label="Indietro">${ic('left')}</button></div>`;
if(!o.ok){main.innerHTML=back+'<div class="sk" style="height:104px;margin-bottom:16px"></div>'+skel(4);return}
if(o.err){main.innerHTML=back+noNet();return}
const play=`<button class="pill p" data-act="pd">${ic('play',1)} Riproduci</button>`;
if(o.k==='mypl'){const p=S.pl.find(x=>x.id===o.id);if(!p){stack.pop();return render()}o.songs=ctx=p.tracks;
main.innerHTML=`${back}<div class="hero in">${cv(p.tracks[0]||{hue:hash(p.id)})}<div><h1 style="font-size:26px">${esc(p.name)}</h1><p class="ar">${p.tracks.length} brani</p></div></div><div class="btns in" style="--i:1">${play}<button class="pill" data-act="ren">Rinomina</button><button class="pill" data-act="del">Elimina</button></div><div style="margin-top:12px">${p.tracks.map(row).join('')||emp('Aggiungi brani dal menu ⋯ di ogni canzone.')}</div>`;return}
ctx=o.songs;
if(o.k==='artist'){const u=o.u;
main.innerHTML=`${back}<div class="hero in">${av(u)}<div><h1 style="font-size:28px">${esc(u.n)}</h1><p class="ar">${u.f.toLocaleString('it-IT')} follower</p></div></div><div class="btns in" style="--i:1">${play}<button class="pill${isArt(u.id)?' p':''}" data-act="follow">${isArt(u.id)?'Segui già':'Segui'}</button></div>${o.bio?`<p class="bio">${esc(o.bio)}</p>`:''}${o.songs.length?'<h2 class="s">Brani più ascoltati</h2>'+o.songs.map(row).join(''):''}${o.albums.length?'<h2 class="s">Album e playlist</h2>'+albCards(o.albums):''}`;return}
const a=o.a;main.innerHTML=`${back}<div class="hero in">${cv(a)}<div><h1 style="font-size:26px">${esc(a.n)}</h1><p class="ar">${esc(a.by)} · ${a.album?'Album':'Playlist'}</p></div></div><div class="btns in" style="--i:1">${play}<button class="pill${isAlb(a.id)?' p':''}" data-act="savealb">${isAlb(a.id)?'Salvato':'Salva'}</button></div><div style="margin-top:12px">${o.songs.map(row).join('')||emp('Nessun brano disponibile.')}</div>`}

/* Riproduzione */
function load(i){idx=i;const t=cur();if(!t)return;au.src=API+'/tracks/'+t.id+'/stream?'+APP;au.play().catch(()=>{});
S.hist=[t].concat(S.hist.filter(x=>x.id!==t.id)).slice(0,30);save();paintTrack();
if('mediaSession' in navigator)try{navigator.mediaSession.metadata=new MediaMetadata({title:t.t,artist:t.a,album:'Sonyra',artwork:t.img?[{src:t.img,sizes:'480x480'}]:[]})}catch(e){}}
function play(list,i){if(!list||!list.length)return;q=list.slice();load(i)}
function next(auto){if(!q.length)return;if(auto&&rp===2){au.currentTime=0;au.play();return}
let n;if(sh&&q.length>1){do n=Math.random()*q.length|0;while(n===idx)}else n=idx+1;
if(n>=q.length){if(auto&&rp===0){au.pause();return}n=0}load(n)}
function prev(){if(au.currentTime>3||!q.length){au.currentTime=0;return}load(idx>0?idx-1:q.length-1)}
const toggle=()=>{if(cur())au.paused?au.play().catch(()=>{}):au.pause()};
try{const ms=navigator.mediaSession;ms.setActionHandler('play',()=>au.play());ms.setActionHandler('pause',()=>au.pause());ms.setActionHandler('previoustrack',prev);ms.setActionHandler('nexttrack',()=>next())}catch(e){}
function paintNext(){const nl=$('#nl');if(sh||q.length<=idx+1){nl.innerHTML='';return}
nl.innerHTML='<h2 class="s">A seguire</h2>'+q.slice(idx+1,idx+7).map((x,j)=>`<div class="row" data-q="${idx+1+j}" role="button" tabindex="0">${cv(x)}<div class="meta"><div class="tt">${esc(x.t)}</div><div class="ar">${esc(x.a)}</div></div></div>`).join('')}
function paintTrack(){const t=cur();$('#mini').hidden=!t;if(!t)return;
$('#mini').innerHTML=`${cv(t)}<div class="meta"><div class="tt">${esc(t.t)}</div><div class="ar">${esc(t.a)}</div></div><button class="ib" id="mpp"></button><div class="bar"><i></i></div>`;
const f=$('#fcv');f.style.setProperty('--h',t.hue);f.innerHTML=t.img?`<img src="${esc(t.img)}" alt="">`:'';
$('#ft').textContent=t.t;$('#fa').textContent=t.a;$('#fl').className='ib'+(isFav(t.id)?' on':'');
document.querySelectorAll('main .row').forEach(r=>r.classList.toggle('on',r.dataset.id===t.id));
paintNext();paintState();paintTime()}
function paintState(){const pl=!au.paused,l=pl?'Pausa':'Riproduci';
document.body.classList.toggle('pl',pl);$('#full').classList.toggle('pl',pl);
$('#pp').innerHTML=ic(pl?'pause':'play',1);$('#pp').setAttribute('aria-label',l);
const m=$('#mpp');if(m){m.innerHTML=ic(pl?'pause':'play',1);m.setAttribute('aria-label',l)}
$('#sh').className='ib'+(sh?' on':'');$('#rp').className='ib'+(rp?' on':'');$('#rp').dataset.m=rp}
function paintTime(){const d=au.duration,c=au.currentTime,p=d?c/d*100:0,s=$('#sk');
s.value=d?c/d*1000:0;s.style.setProperty('--p',p+'%');$('#t1').textContent=fmt(c);$('#t2').textContent=fmt(d);
const bi=$('#mini .bar i');if(bi)bi.style.setProperty('--p',p+'%')}
['play','pause'].forEach(e=>au.addEventListener(e,paintState));
au.addEventListener('ended',()=>next(true));au.addEventListener('timeupdate',paintTime);au.addEventListener('loadedmetadata',paintTime);
au.addEventListener('error',()=>toast('Non riesco a riprodurre questo brano. Prova con un altro.'));

/* Menu, preferiti, playlist */
function sheet(title,items){const e=$('#sheet');e.innerHTML=`<div class="sb"></div><div class="sc"><h3>${esc(title)}</h3>${items.map((x,i)=>`<button class="si" data-k="${i}">${x.l}</button>`).join('')}</div>`;e._i=items;requestAnimationFrame(()=>e.classList.add('open'))}
const closeSheet=()=>$('#sheet').classList.remove('open');
$('#sheet').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b){const f=$('#sheet')._i[+b.dataset.k].f;closeSheet();f()}else if(!e.target.closest('.sc'))closeSheet()});
function toggleLike(id){const t=known.get(id);if(!t)return;const i=S.fav.findIndex(x=>x.id===id);i<0?S.fav.unshift(t):S.fav.splice(i,1);save();
document.querySelectorAll('[data-like="'+id+'"]').forEach(b=>b.classList.toggle('on',isFav(id)));
const c=cur();if(c)$('#fl').className='ib'+(isFav(c.id)?' on':'');
if(view==='lib'&&lib==='songs'&&!stack.length)render()}
function addToPl(pid,t){const p=S.pl.find(x=>x.id===pid);if(!p)return;if(p.tracks.some(x=>x.id===t.id))return toast('È già in “'+p.name+'”');p.tracks.push(t);save();toast('Aggiunto a “'+p.name+'”')}
function newPl(t){const n=prompt('Nome della playlist');if(!n||!n.trim())return;const p={id:'p'+Date.now(),name:n.trim(),tracks:[]};S.pl.unshift(p);save();if(t)addToPl(p.id,t);else render()}
function more(t){const it=[{l:isFav(t.id)?'Rimuovi dai preferiti':'Aggiungi ai preferiti',f:()=>toggleLike(t.id)},
{l:'Aggiungi a una playlist',f:()=>sheet('Aggiungi a…',S.pl.map(p=>({l:esc(p.name),f:()=>addToPl(p.id,t)})).concat([{l:'+ Nuova playlist',f:()=>newPl(t)}]))},
{l:'Aggiungi in coda',f:()=>{if(!q.length)return play([t],0);q.splice(idx+1,0,t);paintNext();toast('Aggiunto in coda')}}];
if(t.aid)it.push({l:'Vai all’artista',f:()=>{closeFull();openD('artist',t.aid)}});
const o=topD();if(o&&o.k==='mypl')it.push({l:'Rimuovi da questa playlist',f:()=>{const p=S.pl.find(x=>x.id===o.id);if(p){p.tracks=p.tracks.filter(x=>x.id!==t.id);save();render()}}});
sheet(t.t,it)}

/* Eventi */
function act(a){const o=topD();
if(a==='back'){stack.pop();return render()}
if(a==='pd'){if(o&&o.songs&&o.songs.length){sh=false;play(o.songs,0)}return}
if(a==='follow'&&o&&o.u){const i=S.art.findIndex(x=>x.id===o.u.id);i<0?S.art.unshift(o.u):S.art.splice(i,1);save();return render()}
if(a==='savealb'&&o&&o.a){const i=S.alb.findIndex(x=>x.id===o.a.id);i<0?S.alb.unshift(o.a):S.alb.splice(i,1);save();return render()}
if(a==='newpl')return newPl();
if(a==='ren'&&o){const p=S.pl.find(x=>x.id===o.id),n=p&&prompt('Nuovo nome',p.name);if(n&&n.trim()){p.name=n.trim();save();render()}return}
if(a==='del'&&o){if(confirm('Eliminare questa playlist?')){S.pl=S.pl.filter(x=>x.id!==o.id);save();stack.pop();render()}return}
if(a==='fresh')return loadHome(true);if(a==='retry')return loadHome();
if(a==='all'&&home&&home[0]){sh=false;play(home[0].items,0)}}
main.addEventListener('click',e=>{
const L=e.target.closest('[data-like]');if(L)return toggleLike(L.dataset.like);
const M=e.target.closest('[data-more]');if(M){const t=known.get(M.dataset.more);if(t)more(t);return}
const A=e.target.closest('[data-act]');if(A)return act(A.dataset.act);
const B=e.target.closest('[data-lib]');if(B){lib=B.dataset.lib;return render()}
const C=e.target.closest('[data-chip]');if(C){query=C.dataset.chip;$('#qi').value=query;return runSearch()}
const T=e.target.closest('[data-art]');if(T)return openD('artist',T.dataset.art);
const Y=e.target.closest('[data-alb]');if(Y)return openD('album',Y.dataset.alb);
const P=e.target.closest('[data-pl]');if(P)return openD('mypl',P.dataset.pl);
const X=e.target.closest('.bio');if(X)return X.classList.toggle('x');
const R=e.target.closest('[data-i]');if(R)play(R.dataset.s!==undefined?shNow[+R.dataset.s].items:ctx,+R.dataset.i)});
main.addEventListener('input',e=>{if(e.target.id==='qi'){query=e.target.value;runSearch()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.row'))e.target.click();if(e.key==='Escape')closeFull()});
const openFull=()=>{$('#full').classList.add('open');$('#full').setAttribute('aria-hidden','false')};
const closeFull=()=>{$('#full').classList.remove('open');$('#full').setAttribute('aria-hidden','true')};
$('#mini').addEventListener('click',e=>{if(e.target.closest('#mpp'))toggle();else openFull()});
$('#close').addEventListener('click',closeFull);
$('#fm').addEventListener('click',()=>{const t=cur();if(t)more(t)});
$('#fa').addEventListener('click',()=>{const t=cur();if(t&&t.aid){closeFull();openD('artist',t.aid)}});
$('#pp').addEventListener('click',toggle);$('#nx').addEventListener('click',()=>next());$('#pv').addEventListener('click',prev);
$('#sh').addEventListener('click',()=>{sh=!sh;paintState();paintNext()});
$('#rp').addEventListener('click',()=>{rp=(rp+1)%3;paintState()});
$('#fl').addEventListener('click',()=>{const t=cur();if(t)toggleLike(t.id)});
$('#sk').addEventListener('input',e=>{if(au.duration)au.currentTime=e.target.value/1000*au.duration});
$('#nl').addEventListener('click',e=>{const r=e.target.closest('[data-q]');if(r)load(+r.dataset.q)});
const SL=[0,15,30,60];let sli=0,slT;
const paintSl=()=>{$('#sl').textContent=SL[sli]?'Spegnimento tra '+SL[sli]+' min':'Timer di spegnimento'};
$('#sl').addEventListener('click',()=>{sli=(sli+1)%4;clearTimeout(slT);if(SL[sli])slT=setTimeout(()=>{au.pause();sli=0;paintSl();toast('Timer scaduto: musica in pausa')},SL[sli]*6e4);paintSl()});

/* Avvio */
$('#close').innerHTML=ic('down');$('#fm').innerHTML=ic('more');$('#fl').innerHTML=ic('heart');$('#sh').innerHTML=ic('shuffle');$('#pv').innerHTML=ic('prev',1);$('#nx').innerHTML=ic('next',1);$('#rp').innerHTML=ic('repeat');
paintState();render();loadHome();
})();
</script>
</body>
</html>
